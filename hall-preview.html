<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hall of Fame form preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .ps-root{font-family:'Hanken Grotesk',sans-serif;color:#111720;min-height:100vh;position:relative;
      background:#FBF7F3;}
    .dsp{font-family:'Archivo',sans-serif;font-weight:800;
      text-transform:uppercase;letter-spacing:.01em;}
    .dsp9{font-family:'Archivo',sans-serif;font-weight:900;
      text-transform:uppercase;letter-spacing:.01em;}
    .eyebrow{font-family:'Archivo',sans-serif;font-weight:700;text-transform:uppercase;
      letter-spacing:.12em;font-size:11px;color:#747679;}
    .panel{background:#FFFFFF;
      border:1px solid #E9E9EA;border-radius:12px;
      box-shadow:0 1px 2px rgba(17,23,32,.04), 0 4px 14px rgba(17,23,32,.05);}
    .chip{border-radius:6px;}
    .skew{transform:none;}
    .unskew{display:inline-block;}
    .btnP{background:#0E3244;color:#fff;
      border:0;border-radius:8px;
      cursor:pointer;width:100%;padding:.75rem 1.5rem;font-size:1.125rem;}
    .btnG{background:#FFFFFF;color:#21262E;border:1px solid #D8D9DA;border-radius:8px;cursor:pointer;width:100%;padding:.65rem 1.5rem;}
    .overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
      padding:0 1rem;background:rgba(17,23,32,.45);backdrop-filter:blur(4px);}
    .modal{padding:1.25rem;width:100%;max-width:28rem;}
    .score-box{margin-bottom:1rem;padding:.75rem 1rem;text-align:center;background:#F1F3F6;border-radius:8px;border:1px solid #E9E9EA;}
    label{display:block;margin-bottom:.75rem;}
    label .eyebrow{display:block;margin-bottom:.375rem;color:#747679;}
    input{width:100%;padding:.625rem .75rem;font-size:.875rem;font-family:inherit;
      background:#FFFFFF;border:1px solid #D8D9DA;color:#111720;outline:none;border-radius:8px;}
    .combo{position:relative;}
    .combo-list{position:absolute;left:0;right:0;z-index:50;margin-top:.25rem;max-height:12rem;
      overflow-y:auto;background:#FFFFFF;border:1px solid #D8D9DA;border-radius:8px;box-shadow:0 12px 28px rgba(17,23,32,.14);
      list-style:none;margin:0;padding:0;display:none;}
    .combo-list.open{display:block;}
    .combo-list li{padding:.5rem .75rem;font-size:.875rem;cursor:pointer;color:#111720;}
    .combo-list li:hover,.combo-list li.active{background:#F0F9FC;}
    .combo-list li.selected{color:#05729A;}
    .combo-list li.empty{color:#747679;cursor:default;}
    .actions{display:flex;flex-direction:column;gap:.5rem;}
    .topbar{display:flex;align-items:center;justify-content:center;padding:.75rem 1.25rem;position:relative;
      background:#0E3244;}
    .badge{background:#FF0A3C;color:#fff;padding:.25rem .75rem;font-size:1.125rem;}
  </style>
</head>
<body>
  <div class="ps-root">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:.75rem;">
        <div class="skew chip badge dsp9"><span class="unskew">8–0</span></div>
        <div class="dsp" style="font-size:1.125rem;color:#fff;">PERFECT SWEEP</div>
      </div>
    </div>
    <div style="height:3px;background:#009DD4"></div>
    <div style="padding:3rem 1.5rem;text-align:center;opacity:.35;">
      <div class="dsp9" style="font-size:4rem;color:#FF0A3C;">DONE</div>
      <p style="color:#595A5C;">You beat the Dream Team. There is nothing left to prove.</p>
    </div>

    <div class="overlay" role="dialog" aria-modal="true">
      <div class="panel modal">
        <div class="eyebrow" style="color:#B30E33;margin-bottom:.25rem;">HALL OF FAME</div>
        <h2 class="dsp" style="font-size:1.5rem;margin:0 0 .25rem;color:#111720;">Enter the Hall of Fame</h2>
        <p style="font-size:.875rem;margin:0 0 1rem;color:#595A5C;">
          Perfect Sweep + Dream Team conquerors only. Score is the sum of your margins.
        </p>
        <div class="score-box">
          <div class="eyebrow" style="color:#747679;">YOUR SCORE</div>
          <div class="dsp9" style="font-size:2.25rem;color:#1D8D47;">147</div>
        </div>
        <label>
          <span class="eyebrow">NICKNAME</span>
          <input type="text" placeholder="2–16 characters" value="CourtVision" maxlength="16" />
        </label>
        <label style="margin-bottom:1rem;">
          <span class="eyebrow">COUNTRY</span>
          <div class="combo" id="country-combo">
            <input
              id="country-input"
              type="text"
              role="combobox"
              aria-expanded="false"
              aria-controls="country-listbox"
              aria-autocomplete="list"
              autocomplete="off"
              placeholder="Type a country…"
              value="🇺🇸 United States"
            />
            <ul id="country-listbox" class="combo-list" role="listbox"></ul>
          </div>
        </label>
        <div class="actions">
          <button type="button" class="btnP skew dsp9"><span class="unskew">SUBMIT</span></button>
          <button type="button" class="skew chip dsp btnG"><span class="unskew">SKIP</span></button>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { COUNTRIES, countryMatchesQuery } from "./countries.js";

    const input = document.getElementById("country-input");
    const list = document.getElementById("country-listbox");
    const root = document.getElementById("country-combo");
    let selected = COUNTRIES.find((c) => c.code === "US");
    let open = false;
    let query = "";
    let highlight = 0;

    function filtered() {
      return COUNTRIES.filter((c) => countryMatchesQuery(c, query));
    }

    function renderList() {
      const items = filtered();
      list.innerHTML = "";
      if (!items.length) {
        list.innerHTML = '<li class="empty">No matches</li>';
        return;
      }
      items.forEach((c, i) => {
        const li = document.createElement("li");
        li.role = "option";
        li.textContent = `${c.flag} ${c.name}`;
        if (c.code === selected.code) li.classList.add("selected");
        if (i === highlight) li.classList.add("active");
        li.addEventListener("mousedown", (e) => e.preventDefault());
        li.addEventListener("click", () => pick(c));
        li.addEventListener("mouseenter", () => {
          highlight = i;
          renderList();
        });
        list.appendChild(li);
      });
    }

    function setOpen(next) {
      open = next;
      list.classList.toggle("open", open);
      input.setAttribute("aria-expanded", String(open));
      if (open) {
        highlight = 0;
        renderList();
      } else {
        query = "";
        input.value = `${selected.flag} ${selected.name}`;
      }
    }

    function pick(c) {
      selected = c;
      setOpen(false);
    }

    input.addEventListener("focus", () => {
      query = "";
      input.value = "";
      setOpen(true);
    });

    input.addEventListener("input", () => {
      query = input.value;
      highlight = 0;
      setOpen(true);
      renderList();
    });

    input.addEventListener("keydown", (e) => {
      const items = filtered();
      if (e.key === "ArrowDown") {
        e.preventDefault();
        setOpen(true);
        highlight = Math.min(highlight + 1, Math.max(items.length - 1, 0));
        renderList();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        highlight = Math.max(highlight - 1, 0);
        renderList();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (open && items[highlight]) pick(items[highlight]);
      } else if (e.key === "Escape") {
        e.preventDefault();
        setOpen(false);
        input.blur();
      }
    });

    document.addEventListener("mousedown", (e) => {
      if (!root.contains(e.target)) setOpen(false);
    });
  </script>
</body>
</html>
